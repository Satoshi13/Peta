<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peta Layer</title>
  <link rel="stylesheet" href="fonts/fonts.css" />
  <link rel="stylesheet" href="app/css/base.css" />
  <link rel="stylesheet" href="app/css/pages.css" />
  <link rel="stylesheet" href="app/css/pack.css" />
  <link rel="stylesheet" href="app/css/polish.css" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="layer-port.css" />

<link rel="stylesheet" href="material-surfaces.css">
</head>
<body data-type="current">
  <!-- One transparent layer per display. Stickers are positioned inside #layer. -->
  <main id="layer"></main>
  <div id="edit-hint" hidden>
    <span>Editing</span>
    <span class="tips">Drag: move · Pull the edge: resize + rotate · ⌥ + drag away: peel off · Double-click: turn over · Drop an image: Create</span>
    <span id="edit-meter"></span>
    <button id="edit-done" type="button">Done</button>
    <small>Esc</small>
  </div>
  <div id="print-hint" class="print-hint" hidden>
    <span><b>Printed.</b> Grab the sticker and stick it anywhere on your desktop.</span>
    <button id="print-later" class="btn paper small" type="button">Later</button>
  </div>
  <script src="app/js/assets.js"></script>
  <script src="app/js/core.js"></script>
  <script src="app/js/audio.js"></script>
  <script src="app/js/sticker.js"></script>
  <script src="layer-port.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
