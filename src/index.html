<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Peta Layer</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="back-card.css" />
</head>
<body>
  <!-- One transparent layer per display. Stickers are positioned inside #layer. -->
  <main id="layer"></main>
  <div id="edit-hint" hidden>
    <span>Editing</span>
    <span class="tips">Drag: move · Pull the edge: resize + rotate · ⌥ + drag away: peel off · Double-click: turn over · Drop an image: today's Peta</span>
    <span id="edit-meter"></span>
    <button id="edit-done" type="button">Done</button>
    <small>Esc</small>
  </div>
  <div id="print-hint" hidden>
    <span>Your Peta is ready</span>
    <span class="tips">Grab it and stick it anywhere</span>
    <button id="print-later" type="button">Later</button>
    <small>Esc</small>
  </div>
  <script type="module" src="main.js"></script>
</body>
</html>
