<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sticker Book</title>
  <link rel="stylesheet" href="collection.css" />
  <link rel="stylesheet" href="back-card.css" />
</head>
<body>
  <!--
    Sticker Book (spec §43-46). Functional skeleton: a page per month, stickers on it, a detail card with the
    back and the history, and the Material Book. Visuals are placeholders: elements with `data-art` mark where
    the book art goes (see docs/ui-handoff.md). Keep ids and data-* hooks.
  -->
  <header>
    <h1>Sticker Book</h1>
    <nav class="tabs" role="tablist">
      <button id="tab-book" role="tab" aria-selected="true" type="button">Book</button>
      <button id="tab-materials" role="tab" aria-selected="false" type="button">Materials</button>
    </nav>
    <label class="name" title="Printed on the back of stickers you make from now on">
      <span>Your name on stickers</span>
      <input id="display-name" type="text" maxlength="40" autocomplete="off" spellcheck="false" />
    </label>
  </header>

  <main id="view-book">
    <aside id="index" data-art="book-tabs" aria-label="Months"></aside>

    <section id="page" class="page" data-art="book-page">
      <div class="spiral" data-art="book-spiral" aria-hidden="true"></div>
      <div class="page-body">
        <h2 id="page-title"></h2>
        <p id="page-sub" class="muted"></p>
        <div id="grid" class="grid"></div>
        <p id="empty" class="muted" hidden>Nothing here yet. Make a Peta from <em>Today's Peta</em> and it will land on this month's page.</p>
      </div>
    </section>

    <aside id="detail" class="detail" hidden>
      <button id="detail-close" class="link" type="button" aria-label="Close">✕</button>
      <div class="stage" id="stage">
        <!-- 台紙: both faces are the same backing sheet; the sticker is stuck on the front of it -->
        <div class="backing" id="detail-front" data-art="backing-sheet"><img id="detail-img" alt="" /></div>
        <div id="detail-back"></div>
      </div>
      <button id="turn" type="button" class="turn">Turn over</button>
      <dl id="facts"></dl>
      <h4>History</h4>
      <ul id="history" class="history"></ul>
      <div class="actions">
        <button id="act-stick" type="button" class="primary">Stick as today's Peta</button>
        <button id="act-peel" type="button">Peel off the desktop</button>
        <button type="button" disabled title="Coming later">Gift</button>
      </div>
      <p id="msg" class="muted" role="status"></p>
    </aside>
  </main>

  <main id="view-materials" hidden>
    <p class="muted">Open Today's Material to add to your book. A material is a way of making stickers — it is never used up.</p>
    <div id="material-grid" class="materials"></div>
  </main>

  <script type="module" src="collection.js"></script>
</body>
</html>
