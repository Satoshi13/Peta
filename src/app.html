<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Peta</title>
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="app/css/base.css">
<link rel="stylesheet" href="app/css/shells.css">
<link rel="stylesheet" href="app/css/pages.css">
<link rel="stylesheet" href="app/css/pack.css">
<link rel="stylesheet" href="app/css/polish.css">
<link rel="stylesheet" href="app/css/native.css">
</head><body data-shell="studio" data-type="current">
  <div id="win-layer"><div id="win" class="win">
    <div class="win-frame">
      <div class="drag-strip" id="titlebar" title="Drag to move"></div>
      <div class="wctl" id="wctl" role="group" aria-label="Window controls"><i class="wc-back"></i>
        <button class="wc wc-red" id="wc-close" type="button" aria-label="Close (Esc)" title="Close (Esc)"></button>
        <button class="wc wc-yellow" id="wc-min" type="button" aria-label="Minimise to the menu bar" title="Minimise to the menu bar"></button>
        <button class="wc wc-green" id="wc-zoom" type="button" aria-label="Fill the screen / restore" title="Fill the screen / restore"></button>
      </div>
      <i class="resize-h" id="resize-h" title="Drag to resize"></i>


      <nav class="nav" id="nav" aria-label="Peta sections"></nav>
      <div class="book" id="bookbox">
        <div class="spiral" aria-hidden="true"></div>
        <div class="viewport" id="viewport"></div>
      </div>
    </div>
  </div></div>

<div id="overlay"></div><div id="toast" role="status"></div>
<script src="app/js/assets.js"></script>
<script src="app/js/core.js"></script>
<script src="app/js/audio.js"></script>
<script src="app/js/sticker.js"></script>
<script src="app/js/catalog.js"></script>
<script src="app/js/bridge.js"></script>

<script src="app/js/shared.js"></script>
<script src="app/js/today.js"></script>
<script src="app/js/ceremony.js"></script>
<script src="app/js/book.js"></script>
<script src="app/js/library-pages.js"></script>
<script src="app/js/settings.js"></script>
<script src="app/js/boot.js"></script>
</body></html>
