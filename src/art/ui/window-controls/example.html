<!doctype html>
<html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Peta window controls</title>
<style>
body { margin:40px; background:#f6f0e5; color:#2b2b2b; font-family:system-ui; }
.peta-window-controls { position:relative; width:108px; height:36px; }
.peta-window-controls > img { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.peta-window-controls > button { position:absolute; top:6px; width:24px; height:24px; margin:0; padding:0; border:0; background:transparent; cursor:pointer; -webkit-app-region:no-drag; }
.peta-window-controls > button:nth-of-type(1) { left:10px; }
.peta-window-controls > button:nth-of-type(2) { left:42px; }
.peta-window-controls > button:nth-of-type(3) { left:74px; }
.peta-window-controls > button img { display:block; width:100%; height:100%; pointer-events:none; }
.peta-window-controls > button:hover img { filter:brightness(1.04); }
.peta-window-controls > button:active img { transform:translateY(.5px); filter:brightness(.97); }
.peta-window-controls > button:focus-visible { outline:2px solid #586b8b; outline-offset:1px; border-radius:50%; }
</style>
<div class="peta-window-controls" role="group" aria-label="ウィンドウ操作">
<img src="pill-backing.png" alt="" draggable="false">
<button type="button" aria-label="閉じる" title="閉じる" data-action="close"><img src="button-red.png" alt="" draggable="false"></button>
<button type="button" aria-label="最小化" title="最小化" data-action="minimize"><img src="button-yellow.png" alt="" draggable="false"></button>
<button type="button" aria-label="最大化・元に戻す" title="最大化・元に戻す" data-action="maximize"><img src="button-green.png" alt="" draggable="false"></button>
</div>
</html>
