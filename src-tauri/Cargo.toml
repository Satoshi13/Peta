[package]
name = "peta"
version = "0.0.1"
description = "Peta — One sticker a day."
edition = "2021"
rust-version = "1.77"

[workspace]
members = ["crates/core"]

[lib]
name = "peta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent windows on macOS (not App Store compatible; see docs/phase0.md)
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
peta-core = { path = "crates/core" }
tauri-plugin-dialog = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

# Image resizing / SQLite are painfully slow at opt-level 0; the app itself stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
opt-level = "s"
