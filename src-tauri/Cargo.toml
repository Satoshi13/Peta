[package]
name = "peta"
version = "0.0.1"
description = "Peta — One sticker a day."
edition = "2021"
rust-version = "1.77"

[lib]
name = "peta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent windows on macOS (not App Store compatible; see docs/phase0.md)
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[profile.release]
lto = true
opt-level = "s"
