[package]
name = "peta"
version = "0.0.1"
description = "Peta — One sticker a day."
edition = "2021"
rust-version = "1.77.2"

[workspace]
members = ["crates/core", "crates/peta-pass"]

[features]
developer = ["peta-core/developer", "server"]
server = ["peta-core/daily-tables", "dep:ureq", "dep:ed25519-dalek", "dep:base64", "dep:getrandom"]

[lib]
name = "peta_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: required for transparent windows on macOS (not App Store compatible; see docs/phase0.md)
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
peta-core = { path = "crates/core" }
tauri-plugin-dialog = "2"
ureq = { version = "2.12.1", default-features = false, features = ["tls"], optional = true }
ed25519-dalek = { version = "2", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.3", optional = true }

objc2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSObject", "NSString", "NSNotification"] }
objc2-core-location = { version = "0.3.2", default-features = false, features = ["std", "CLLocationManager", "CLLocationManagerDelegate"] }
tauri-plugin-deep-link = "=2.4.10"

# Image resizing / SQLite are painfully slow at opt-level 0; the app itself stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
opt-level = "s"

# Pixel loops (mask refinement, material rendering) must be fast even in `npm run dev`.
[profile.dev.package.peta-core]
opt-level = 3
