[[permission]]
identifier = "allow-profile-icon"
description = "Choose a local creator icon from owned original stickers"
commands.allow = ["profile_set_icon"]

[[permission]]
identifier = "allow-set-reflection-active"
description = "Enable cursor reflection for the calling desktop layer."
commands.allow = ["set_reflection_active"]

[[permission]]
identifier = "allow-reflection-status"
description = "Read reflection activity and cursor sampling counters."
commands.allow = ["reflection_status"]

# Adding an app permission manifest requires granting the existing native IPC too.
[[permission]]
identifier = "allow-existing-app-commands"
description = "Preserve native commands available before desktop effect permissions were added."
commands.allow = ["port_capture_report", "port_capture_tray", "layer_info", "layer_placements", "save_placement", "peel_sticker", "sticker_asset", "sticker_thumb", "import_dropped", "exit_edit_mode", "daily_status", "daily_open_material", "daily_create", "collection_unused", "daily_stick_from_collection", "creator_begin_path", "creator_begin_bytes", "creator_info", "creator_original", "creator_render", "creator_stroke", "creator_clear_edits", "creator_finish", "creator_edit_original", "creator_save_original", "creator_undo", "creator_redo", "creator_cancel", "arrival_status", "arrival_open", "gift_send", "gift_receive_file", "gift_inbox", "gift_open", "pack_install_demo", "pack_status", "pack_sales", "inbox_status", "friend_preview", "inbox_set_auto", "identity_export", "identity_import", "friend_code_copied", "friend_add", "friend_approve", "friend_decline", "friend_block", "friend_unblock", "friend_remove", "inbox_check", "gift_send_friend", "inbox_report", "inbox_leave", "pack_open", "pack_open_free", "print_resume", "print_pending", "print_paste", "print_later", "book_index", "book_page", "sticker_back", "sticker_delete_original", "material_book", "profile_get", "profile_set"]

[[permission]]
identifier = "allow-haptic-tap"
description = "Play optional tactile feedback for a completed paper gesture."
commands.allow = ["haptic_tap"]

[[permission]]
identifier = "allow-scrap-trades"
description = "Read Scraps and confirm local material dismantling and exchanges in the main app."
commands.allow = ["scrap_status", "scrap_trade"]

[[permission]]
identifier = "allow-signed-distribution"
description = "Redeem a signed official code and read local distribution receipts."
commands.allow = ["redeem_code", "event_inbox", "creator_pack_accept", "creator_pack_pending", "creator_pack_decline", "creator_pack_save", "creator_pack_shelve", "creator_pack_export", "creator_pack_store", "creator_pack_set_listed", "link_tag_status", "link_tag_attach", "link_tag_set_show", "link_tag_remove", "link_tag_pick", "link_tag_open", "link_tag_icon", "link_tag_app_icon", "layer_capture", "pack_peek", "pack_peek_picture", "pack_cover_picture"]

[[permission]]
identifier = "allow-developer-tools"
description = "Developer tools are rejected by the distribution edition in Rust."
commands.allow = ["developer_next_day", "developer_sync_displays", "developer_show_arrival", "referee_status", "referee_sync"]

[[permission]]
identifier = "allow-arrival-notification"
description = "Read and open the desktop arrival envelope"
commands.allow = ["arrival_status", "arrival_hover_status", "arrival_open"]

[[permission]]
identifier = "allow-poster-save"
description = "Save a Collection month poster as a PNG the person chooses a place for."
commands.allow = ["poster_save"]

[[permission]]
identifier = "allow-window-vibrancy"
description = "Let the main window show a translucent sidebar material behind its page."
commands.allow = ["window_vibrancy"]

[[permission]]
identifier = "allow-clipboard-create"
description = "Start a cutting session from the picture on the clipboard."
commands.allow = ["creator_begin_clipboard"]

[[permission]]
identifier = "allow-link-tag-desktop"
description = "Let a desktop layer see which stickers carry a link tag, take the click while the pointer is over one, and open its target. Nothing else from the distribution set."
commands.allow = ["link_tag_status", "link_tag_open", "layer_capture"]

[[permission]]
identifier = "allow-boards"
description = "Manage local screen boards and Auto rules from the main window."
commands.allow = ["boards_status", "boards_save", "boards_update", "boards_rename", "boards_delete", "boards_put", "boards_undo", "boards_bring_here", "board_rule_save", "board_rule_delete", "board_rule_move", "board_rule_toggle", "boards_location_request", "boards_take_notes"]

[[permission]]
identifier = "allow-friend-links"
description = "Read local friend links after the app frontend is ready; never sends a request."
commands.allow = ["friend_link_take"]

[[permission]]
identifier = "allow-friend-market"
description = "Friends' packs in Market: list, pull, sell and collect Scraps through Peta's server (server builds only)."
commands.allow = ["market_friend_listings", "market_card", "market_pull", "market_list_pack", "market_pause_pack", "market_close_pack", "market_payouts_sync"]

[[permission]]
identifier = "allow-about-notices"
description = "Open bundled notices and owner-configured legal documents from About Peta."
commands.allow = ["about_notices", "about_links", "about_open_link"]

[[permission]]
identifier = "allow-library-move"
description = "Export a passphrase-protected full library and restore only into a frozen fresh installation."
commands.allow = ["move_bootstrap_done", "move_status", "library_move_export", "library_move_import"]
