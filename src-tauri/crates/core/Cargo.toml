[package]
name = "peta-core"
version = "0.0.1"
edition = "2021"
description = "Peta core: sticker library (SQLite), image import. No UI / OS dependencies."

[features]
developer = []

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
getrandom = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

ed25519-dalek = "2"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFData", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGColorSpace", "CGDataProvider", "CGImage", "objc2"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSIndexSet", "NSError", "NSObject", "NSProcessInfo", "NSString"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNGenerateForegroundInstanceMaskRequest", "VNRequest", "VNRequestHandler", "VNObservation", "objc2-core-graphics", "objc2-core-video"] }
